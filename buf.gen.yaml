version: v2
managed:
  enabled: true
  disable:
    - file_option: csharp_namespace
plugins:
  - remote: buf.build/protocolbuffers/cpp:v31.1
    out: ./cpp/
  - remote: buf.build/grpc/cpp:v1.76.0
    out: ./cpp/
  - remote: buf.build/protocolbuffers/python:v31.1
    out: ./python/
  - remote: buf.build/grpc/python:v1.76.0
    out: ./python/
  - remote: buf.build/protocolbuffers/java:v31.1
    out: ./java/
  - remote: buf.build/grpc/java:v1.76.0
    out: ./java/
  - remote: buf.build/protocolbuffers/csharp:v31.1
    out: ./csharp/proto/
    opt:
      - base_namespace=
  - remote: buf.build/grpc/csharp:v1.76.0
    out: ./csharp/proto/
    opt:
      - base_namespace=
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: ./rust/proto/
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: ./rust/proto/
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: ./rust/proto/
    opt:
      - include_file=mod.rs
      - no_features
inputs:
  - directory: proto
